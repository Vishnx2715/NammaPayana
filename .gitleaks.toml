title = "Namma Payana Gitleaks Config"

[[rules]]
id = "gemini-api-key"
description = "Google Gemini / AI Studio API Key"
regex = '''AQ\.[A-Za-z0-9_\-]{20,}'''
tags = ["key", "google", "gemini"]

[[rules]]
id = "supabase-jwt"
description = "Supabase JWT (eyJ... format with supabase payload)"
regex = '''eyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}'''
tags = ["key", "supabase", "jwt"]

[[rules]]
id = "supabase-url"
description = "Supabase Project URL"
regex = '''https://[a-z0-9]{20,}\.supabase\.co'''
tags = ["url", "supabase"]

[[rules]]
id = "supabase-publishable-key"
description = "Supabase Publishable Key"
regex = '''sb_publishable_[A-Za-z0-9_\-]{10,}'''
tags = ["key", "supabase"]

[allowlist]
description = "Ignore test fixtures and placeholder values"
regexes = [
  '''your_gemini_api_key_here''',
  '''your_supabase_anon_key_here''',
  '''your-project\.supabase\.co''',
  '''REDACTED_'''
]
paths = [
  '''.env.example''',
  '''SECURITY_NOTES.md''',
  '''.gitleaks.toml'''
]
